# Aether VM 运行配置（Android / 真机）
# 与宿主端 host/vm.conf 结构相同，由同一份 core/vm_config.c 解析。
# 差异仅为平台相关：显示走 SDL、不做 9p 取证、不自动跑自检脚本。
name        = Aether OS
machine     = virt
cpu         = cortex-a57
# 【运行参数】TCG 单线程、guest 384MB、TB 128MB。
#  注：1.0.5~1.0.7 真机在 qemu_init 参数解析阶段的 SIGSEGV 与参数取值无关，
#      根因是引擎交叉编译时 strchrnul 隐式声明导致 64 位指针被 32 位截断，
#      已在 1.0.8 通过重编引擎从编译层面修复。本组参数保持不变。
accel       = tcg,tb-size=128
smp         = 1
memory_mb   = 384
disk_if     = virtio
append      = root=/dev/vda rw init=/sbin/aether-init console=ttyAMA0 loglevel=4 rootwait @AVF_ARGS@
gpu         = virtio-gpu-pci
width       = 720
height      = 1280
display     = sdl

# Application 首启时把 @KERNEL@ / @DISK@ / @RUN@ 换成私有目录绝对路径
kernel      = @KERNEL@
disk        = @DISK@
serial_log  = @RUN@/serial.log
engine      = libqemu-system-aarch64.so
backend     = dlopen
enable_qmp  = 0
