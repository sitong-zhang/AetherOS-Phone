# Aether VM 运行配置（自研 key=value 格式）
# 这是「在这里跑通闭环」用的宿主配置；Android 端用 assets 内的同名结构。
name        = Aether OS Minimal
machine     = virt
cpu         = cortex-a57
accel       = tcg,thread=multi,tb-size=4096
smp         = 1
memory_mb   = 512
disk_if     = virtio
# aether.avf.* 由 Android 端 AvfCapability.kernelArgs 在真机注入；host 闭环
# 显式给出「pKVM 不可用」的一组，用于验证 aether-android 兼容层的降级路径
# （第三方 APK 无 MANAGE_VIRTUAL_MACHINE / AVF 无图形 HAL 的真实场景）。
append      = root=/dev/vda rw init=/sbin/aether-init console=ttyAMA0 loglevel=4 rootwait aether.phonetest=1 aether.avf.level=0 aether.avf.name=none aether.avf.pkvm=0 aether.avf.appapi=0
gpu         = virtio-gpu-pci
width       = 720
height      = 1280

# 由 run.sh 注入绝对路径（也可直接改这里）
kernel      = @KERNEL@
disk        = @DISK@
bios_dir    = /usr/share/qemu
serial_log  = @RUN@/serial.log
share_dir   = @RUN@/frames
qmp_sock    = @RUN@/qmp.sock
pidfile     = @RUN@/qemu.pid
enable_qmp  = 1
