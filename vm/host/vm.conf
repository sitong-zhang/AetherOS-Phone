# Aether VM 运行配置（自研 key=value 格式）
# 这是「在这里跑通闭环」用的宿主配置；Android 端用 assets 内的同名结构。
name        = Aether OS Minimal
machine     = virt
cpu         = cortex-a57
accel       = tcg,thread=multi,tb-size=4096
smp         = 1
memory_mb   = 512
disk_if     = virtio
append      = root=/dev/vda rw init=/sbin/aether-init console=ttyAMA0 loglevel=4 rootwait aether.phonetest=1
gpu         = virtio-gpu-pci
width       = 720
height      = 1280

# 由 run.sh 注入绝对路径（也可直接改这里）
kernel      = @KERNEL@
disk        = @DISK@
bios_dir    = /usr/share/qemu
serial_log  = @RUN@/serial.log
share_dir   = @RUN@/frames
qmp_sock    = @RUN@/qmp.sock
pidfile     = @RUN@/qemu.pid
enable_qmp  = 1
